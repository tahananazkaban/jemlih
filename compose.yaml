name: jemlih

x-service: &service
  build:
    context: .
  healthcheck:
    test: ["CMD", "/service", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 10
  depends_on:
    floci:
      condition: service_healthy
  mem_limit: 128m
  restart: unless-stopped

x-service-env: &service-env
  HTTP_ADDR: ":8080"
  JEMLIH_AWS_ENDPOINT: http://floci:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
  # Tokens name floci as issuer because FLOCI_HOSTNAME is floci
  COGNITO_ISSUER: http://floci:4566/${COGNITO_USER_POOL_ID:-unset}
  COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-unset}

services:
  floci:
    image: floci/floci:2.3.0
    # Root is needed to drive the host Docker socket for Lambda containers
    user: root
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped

  fleet:
    <<: *service
    build:
      context: .
      args:
        SERVICE: fleet
    ports:
      - "${FLEET_PORT:-8081}:8080"
    environment:
      <<: *service-env
      FLEET_TABLE: ${FLEET_TABLE:-jemlih-fleet}

  account:
    <<: *service
    build:
      context: .
      args:
        SERVICE: account
    ports:
      - "${ACCOUNT_PORT:-8082}:8080"
    environment:
      <<: *service-env
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-unset}

volumes:
  floci-data:
